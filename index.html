<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="阅迹，让每一次阅读都有回响。一个基于微信读书 Skill 的个人阅读分析空间。">
  <title>阅迹 · 我的阅读空间</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232e5ddb'/%3E%3Cpath d='M7 9c4-1 7 0 9 2 2-2 5-3 9-2v14c-4-1-7 0-9 2-2-2-5-3-9-2zM16 11v14' fill='none' stroke='white' stroke-width='1.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <aside class="sidebar" aria-label="主导航">
    <a href="#overview" class="brand"><span class="brand-icon" data-icon="book"></span><span>阅迹<small>READ YOURSELF</small></span></a>
    <div class="space-label">我的阅读空间</div>
    <nav>
      <button class="nav-item active" data-view="overview"><span data-icon="grid"></span>阅读总览</button>
      <button class="nav-item" data-view="library"><span data-icon="books"></span>我的书架<span class="nav-count" id="shelf-count">—</span></button>
      <button class="nav-item" data-view="notes"><span data-icon="pen"></span>笔记与想法<span class="nav-count" id="notes-count">—</span></button>
      <button class="nav-item" data-view="discover"><span data-icon="search"></span>发现好书</button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-view="skills"><span data-icon="sparkles"></span>我的 Skills<span class="tiny-tag" id="skill-tag">已安装</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="connection-card" data-action="connect"><span class="connection-icon" data-icon="link"></span><strong id="sidebar-connect-title">微信读书 Skill</strong><span id="sidebar-connect-copy">本机已安装 · 等待连接账号<br>让阅读数据在这里相遇</span><span class="connection-cta"><span id="sidebar-connect-action">连接账号</span><span data-icon="plus"></span></span></button>
      <div class="sidebar-footer"><span class="avatar">阅</span><span>我的阅读空间<small>一点一滴，读懂自己</small></span><button class="icon-button" data-view="skills" aria-label="管理阅读 Skill"><span data-icon="settings"></span></button></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span class="breadcrumb">我的空间 <span>/</span> <strong id="breadcrumb-title">阅读总览</strong></span><div class="topbar-right"><span class="demo-badge" id="data-badge"><i></i>示例数据</span><button class="top-connect" data-action="connect"><span data-icon="link"></span><span id="connection-label">连接微信读书</span></button><span class="top-avatar">阅</span></div></header>
    <main id="main-content"></main>
    <footer class="page-footer"><span>阅迹 · 每一次翻页，都在塑造你</span><span id="data-source">当前展示示例数据 · 尚未连接微信读书</span></footer>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><span id="dialog-eyebrow">阅读空间</span><button class="icon-button" id="dialog-close" aria-label="关闭面板"><span data-icon="close"></span></button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
